# Local dev: chỉ chạy infra (postgres + redis), backend/frontend dùng pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_interview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  tts-sidecar:
    build:
      context: ./apps/tts-sidecar
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      TTS_VOICE: vi-VN-HoaiMyNeural

  stt-sidecar:
    build:
      context: ./apps/stt-sidecar
      args:
        WHISPER_MODEL: medium
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      WHISPER_MODEL: medium
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8

volumes:
  postgres_data:
  redis_data:
  minio_data:
